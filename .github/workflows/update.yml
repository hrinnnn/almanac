name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Fetch Douban marks
        run: python fetch.py

      - name: Download new covers
        run: python covers.py

      - name: Build
        run: python build.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/marks.json; then
            echo "no new marks"
            exit 0
          fi
          git config user.name "almanac-bot"
          git config user.email "almanac-bot@users.noreply.github.com"
          git add data docs
          git commit -m "update: $(date '+%Y-%m-%d %H:%M')"
          git push
